<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presidents">
<title>U.S. Presidents</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1b2a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    user-select: none;
  }

  #app {
    width: 100%;
    min-height: 100vh;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .number {
    font-size: 22px;
    opacity: 0.65;
    margin-bottom: 18px;
  }

  .name {
    font-size: 42px;
    font-weight: 700;
    line-height: 1.15;
    max-width: 700px;
  }

  .years {
    margin-top: 20px;
    font-size: 24px;
    opacity: 0.8;
  }

  .instruction {
    position: fixed;
    bottom: 35px;
    font-size: 16px;
    opacity: 0.45;
  }
</style>
</head>

<body>

<div id="app">
  <div class="number" id="number"></div>
  <div class="name" id="name">Tap to begin</div>
  <div class="years" id="years"></div>
  <div class="instruction">Tap anywhere for the next president</div>
</div>

<script>
const presidents = [
  ["George Washington", "1789–1797"],
  ["John Adams", "1797–1801"],
  ["Thomas Jefferson", "1801–1809"],
  ["James Madison", "1809–1817"],
  ["James Monroe", "1817–1825"],
  ["John Quincy Adams", "1825–1829"],
  ["Andrew Jackson", "1829–1837"],
  ["Martin Van Buren", "1837–1841"],
  ["William Henry Harrison", "1841"],
  ["John Tyler", "1841–1845"],
  ["James K. Polk", "1845–1849"],
  ["Zachary Taylor", "1849–1850"],
  ["Millard Fillmore", "1850–1853"],
  ["Franklin Pierce", "1853–1857"],
  ["James Buchanan", "1857–1861"],
  ["Abraham Lincoln", "1861–1865"],
  ["Andrew Johnson", "1865–1869"],
  ["Ulysses S. Grant", "1869–1877"],
  ["Rutherford B. Hayes", "1877–1881"],
  ["James A. Garfield", "1881"],
  ["Chester A. Arthur", "1881–1885"],
  ["Grover Cleveland", "1885–1889"],
  ["Benjamin Harrison", "1889–1893"],
  ["Grover Cleveland", "1893–1897"],
  ["William McKinley", "1897–1901"],
  ["Theodore Roosevelt", "1901–1909"],
  ["William Howard Taft", "1909–1913"],
  ["Woodrow Wilson", "1913–1921"],
  ["Warren G. Harding", "1921–1923"],
  ["Calvin Coolidge", "1923–1929"],
  ["Herbert Hoover", "1929–1933"],
  ["Franklin D. Roosevelt", "1933–1945"],
  ["Harry S. Truman", "1945–1953"],
  ["Dwight D. Eisenhower", "1953–1961"],
  ["John F. Kennedy", "1961–1963"],
  ["Lyndon B. Johnson", "1963–1969"],
  ["Richard Nixon", "1969–1974"],
  ["Gerald Ford", "1974–1977"],
  ["Jimmy Carter", "1977–1981"],
  ["Ronald Reagan", "1981–1989"],
  ["George H. W. Bush", "1989–1993"],
  ["Bill Clinton", "1993–2001"],
  ["George W. Bush", "2001–2009"],
  ["Barack Obama", "2009–2017"],
  ["Donald Trump", "2017–2021"],
  ["Joe Biden", "2021–2025"],
  ["Donald Trump", "2025–present"]
];

let index = -1;

function nextPresident() {
  index++;

  if (index >= presidents.length) {
    index = 0;
  }

  document.getElementById("number").textContent =
    (index + 1) + (index === 21 ? "nd" : index === 22 ? "rd" : index === 23 ? "th" : "th") + " President";

  document.getElementById("name").textContent = presidents[index][0];
  document.getElementById("years").textContent = presidents[index][1];
}

document.getElementById("app").addEventListener("click", nextPresident);
</script>

</body>
</html>
